services:
  namenode:
    image: docker.io/apache/hadoop:3.3.6
    container_name: rat-namenode
    command: hdfs namenode
    ports:
      - "8020:8020"   # fs.defaultFS — Spark on the host talks here
      - "9870:9870"   # NameNode web UI
    environment:
      # formats on first boot only: the dir is missing inside the fresh volume
      ENSURE_NAMENODE_DIR: /data/name
      CORE-SITE.XML_fs.defaultFS: hdfs://namenode:8020
      HDFS-SITE.XML_dfs.namenode.name.dir: /data/name
      # single-tenant pipeline: host users vary (hive, spark, root), checks off
      HDFS-SITE.XML_dfs.permissions.enabled: "false"
    volumes:
      - hdfs-namenode:/data
    networks: [rat-data]

  datanode:
    image: docker.io/apache/hadoop:3.3.6
    container_name: rat-datanode
    command: hdfs datanode
    depends_on: [namenode]
    environment:
      CORE-SITE.XML_fs.defaultFS: hdfs://namenode:8020
      HDFS-SITE.XML_dfs.datanode.data.dir: /data/data
      # advertise a host-reachable address: every client (Spark on the host,
      # hive services on host network) reaches the data path via the
      # published port, not the container IP
      HDFS-SITE.XML_dfs.datanode.hostname: localhost
    ports:
      - "9866:9866"   # data transfer
    volumes:
      - hdfs-datanode:/data
    networks: [rat-data]

volumes:
  hdfs-namenode:
  hdfs-datanode:

networks:
  rat-data:
    name: rat-data
