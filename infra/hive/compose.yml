services:
  metastore:
    image: docker.io/apache/hive:3.1.3
    container_name: rat-hive-metastore
    # host network: the metastore resolves table LOCATIONs itself, so it must
    # see the same localhost:8020 (NameNode) the host-side Spark uses
    network_mode: host
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: derby
      METASTORE_PORT: "9083"
      HIVE_CUSTOM_CONF_DIR: /custom-conf
      IS_RESUME: "true"   # entrypoint skips init; the wrapper below handles it
    entrypoint: >
      /bin/sh -c '
      if ! /opt/hive/bin/schematool -dbType derby -info >/dev/null 2>&1; then
        echo "initializing metastore schema";
        /opt/hive/bin/schematool -dbType derby -initSchema;
      fi;
      exec /entrypoint.sh'
    volumes:
      - ./conf:/custom-conf:ro

  hiveserver2:
    image: docker.io/apache/hive:3.1.3
    container_name: rat-hiveserver2
    network_mode: host
    depends_on: [metastore]
    environment:
      SERVICE_NAME: hiveserver2
      DB_DRIVER: derby
      HIVE_CUSTOM_CONF_DIR: /custom-conf
      IS_RESUME: "true"
    entrypoint: >
      /bin/sh -c '
      for i in $(seq 1 30); do
        if (exec 3<>/dev/tcp/localhost/9083) >/dev/null 2>&1; then
          exec 3>&-; break;
        fi;
        sleep 2;
      done;
      exec /entrypoint.sh'
    volumes:
      - ./conf:/custom-conf:ro
