name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      legacy:
        description: Also validate the original JVM stack
        type: boolean
        default: false

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --workspace

  rust-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [producers, rust]
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - run: uv sync --frozen
      - run: cargo build --locked -p rat-rs
      - run: RAT_ENGINE_BIN="$PWD/target/debug/rat-rs" ./scripts/smoke-rust.sh

  producers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check producers/
      - name: Unit tests (no broker needed)
        run: uv run pytest producers/tests/ -q

  scala:
    if: github.event_name == 'workflow_dispatch' && inputs.legacy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: coursier/setup-action@v2
        with:
          apps: sbt:1.10.11 scalafmt:3.8.3
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.sbt
          key: ${{ runner.os }}-sbt-${{ hashFiles('spark/build.sbt', 'spark/project/build.properties') }}
          restore-keys: ${{ runner.os }}-sbt-
      - name: Format check
        working-directory: spark
        run: scalafmt --test
      - name: Compile + test
        working-directory: spark
        run: sbt -batch test

  e2e:
    if: github.event_name == 'workflow_dispatch' && inputs.legacy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [producers, scala]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: coursier/setup-action@v2
        with:
          apps: sbt:1.10.11
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.sbt
          key: ${{ runner.os }}-sbt-${{ hashFiles('spark/build.sbt', 'spark/project/build.properties') }}
          restore-keys: ${{ runner.os }}-sbt-
      - name: End-to-end smoke (broker, topics, fixture, Correlate, Query)
        run: ./scripts/smoke.sh

  e2e-hive:
    if: github.event_name == 'workflow_dispatch' && inputs.legacy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [producers, scala]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: coursier/setup-action@v2
        with:
          apps: sbt:1.10.11
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.sbt
          key: ${{ runner.os }}-sbt-${{ hashFiles('spark/build.sbt', 'spark/project/build.properties') }}
          restore-keys: ${{ runner.os }}-sbt-
      - name: Real HDFS + HiveServer2 + Beeline smoke
        run: ./scripts/smoke-hive.sh
