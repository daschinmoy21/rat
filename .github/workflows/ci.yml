name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  producers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check producers/
      - name: Unit tests (no broker needed)
        run: uv run pytest producers/tests/ -q
