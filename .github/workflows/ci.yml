name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  producers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check producers/
      - name: Unit tests (no broker needed)
        run: uv run pytest producers/tests/ -q

  scala:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: coursier/setup-action@v2
        with:
          apps: sbt:1.10.11 scalafmt:3.8.3
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.sbt
          key: ${{ runner.os }}-sbt-${{ hashFiles('spark/build.sbt', 'spark/project/build.properties') }}
          restore-keys: ${{ runner.os }}-sbt-
      - name: Format check
        working-directory: spark
        run: scalafmt --test
      - name: Compile + test
        working-directory: spark
        run: sbt -batch test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [producers, scala]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: coursier/setup-action@v2
        with:
          apps: sbt:1.10.11
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.sbt
          key: ${{ runner.os }}-sbt-${{ hashFiles('spark/build.sbt', 'spark/project/build.properties') }}
          restore-keys: ${{ runner.os }}-sbt-
      - name: End-to-end smoke (broker, topics, fixture, Correlate, Query)
        run: ./scripts/smoke.sh
