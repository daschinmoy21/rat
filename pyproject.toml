[project]
name = "rat"
version = "0.1.0"
description = "Kafka → Spark Structured Streaming → Hive/HDFS"
requires-python = ">=3.12"
dependencies = [
  "rat-producers",
]

[dependency-groups]
dev = [
  "ruff>=0.6.0",
]

[tool.uv.workspace]
members = ["producers"]

[tool.uv.sources]
rat-producers = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["producers"]
