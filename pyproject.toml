[project]
name = "rat"
version = "0.1.0"
description = "Kafka → Spark Structured Streaming → Hive/HDFS"
requires-python = ">=3.12"
dependencies = [
  "rat-producers",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]

[tool.uv.workspace]
members = ["producers"]

[tool.uv.sources]
rat-producers = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["producers"]

[tool.ruff.lint.per-file-ignores]
# broad excepts are the boundary policy: retry/DLQ in emit, source isolation in run
"producers/rat_producers/producer.py" = ["BLE001"]
"producers/rat_producers/cli.py" = ["BLE001"]
# broker probe answers a boolean: any failure means down
"producers/rat_producers/status.py" = ["BLE001"]
